# This target's entry into the raw lane, per Running CI. It runs the
# same task file main.yml runs, so the assertions have one home; what
# it chooses is which of them an interpreter-free host can answer and
# what vars they run under.
#
# The module is a command spec routed through o0_o.core.command, which
# hands a POSIX host to o0_o.posix.command, so the fallback carries it
# the same way it carries anything else. Proving that here is what
# makes the dispatcher's own claim -- that the caller need not know
# how the host is reached -- true of a host with no interpreter.
#
# main.yml turns the file through a loop that names the row's check
# mode as a var. Nothing in the file reads that var, so the two rows
# ask the host the same question twice; the lane takes the row that
# runs and pays for the round trip once.

- name: Greet from a host with no interpreter
  ansible.builtin.include_tasks: test_success.yml
  vars:
    ansible_check_mode: false
