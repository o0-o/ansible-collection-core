- name: Run hello_world module
  o0_o.core.hello_world:
  register: hello_world_reg

- name: Assert hello_world succeeded
  ansible.builtin.assert:
    that:
      - hello_world_reg is success
      - hello_world_reg is not changed

- name: Assert hello_world returned correct message
  ansible.builtin.assert:
    that:
      - hello_world_reg['message'] is defined
      - hello_world_reg['message'] == 'Hello, world!'

- name: Verify message is a string
  ansible.builtin.assert:
    that:
      - hello_world_reg['message'] is string
