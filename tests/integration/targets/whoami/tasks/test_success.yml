- name: Run whoami module
  o0_o.core.whoami:
  register: whoami_reg

- name: Assert whoami succeeded
  ansible.builtin.assert:
    that:
      - whoami_reg is success
      - whoami_reg is not changed
      - whoami_reg['user'] is defined
      - whoami_reg['user'] | length > 0

- name: Assert user matches current user
  ansible.builtin.assert:
    that:
      - whoami_reg['user'] == ansible_user_id
  when: ansible_user_id is defined

- name: Verify whoami output is a string
  ansible.builtin.assert:
    that:
      - whoami_reg['user'] is string
